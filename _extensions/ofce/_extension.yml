title: Format OFCE
author: Anissa Saumtally et Xavier Timbeau
version: 0.6.0
quarto-required: ">=1.9.38"
contributes:
  formats:
    common:
      toc: true
      lang: fr
      french: true
      fig-asp: 0.61
      cap-location: top
      language:
        fr:
          section-title-references: "Bibliographie"
          title-block-author-single: "Par"
          title-block-author-plural: "Par"
          title-block-published: "Publié le"
          title-block-modified: "Màj le"
          callout-tip-title: "Encadré"
          toc-title: "Sur cette page"
          draft: "Version préliminaire"
        en:
          section-title-references: "Bibliography"
          title-block-author-single: "Author"
          title-block-author-plural: "Authors"
          title-block-published: "Published on"
          title-block-modified: "Updated on"
          callout-tip-title: "Box"
          toc-title: "On this page"
          draft: "Preliminary version"
      crossref:
        chapters: false
        title-delim: "**.**"
        fr:
          fig-prefix: graphique
          tbl-prefix: tableau
          eq-prefix: équation
          sec-prefix: section
          tip-prefix: encadré
          fig-title: "**Graphique**"
          tip-title: "**Encadré**"
          title-delim: "**.**"
          tbl-title: "**Tableau**"
          lof-title: Graphiques
          lot-title: Tableaux
        en:
          fig-prefix: figure
          tbl-prefix: table
          eq-prefix: equation
          sec-prefix: section
          tip-prefix: box
          fig-title: "**Figure**"
          tip-title: "**Box**"
          title-delim: "**.**"
          tbl-title: "**Table**"
          lof-title: Figures
          lot-title: Tables
      logo: ../ofce/img/IFE-OFCE_logo_noir.png
      filters:
        - quotes
        - collapse-callout
        - nbsp
        - quarto
        - wordcount
      shortcodes:
        - fontawesome
      csl: csl/revue-francaise-de-gestion.csl
      license: CC BY

    html:
      theme:
        - bootstrap
        - sass/default.scss
        - sass/rules.scss
        - ofce.scss
        - newfont.scss
      include-in-header:
        - html/url-nav-active.html
        - html/encadre.js
      lightbox: true
      link-external-icon: true
      mainfont: Open Sans
      toc-location: left
      toc-depth: 4
      number-depth: 4
      html-math-method: katex
      fig-dpi: 1200
      fig-format: svg
      reference-location: margin
      fig-width: 6
      callout-icon: false
      title-block-style: default
      image-lazy-loading: true
      number-sections: true
      hide-description: true
      template-partials:
        - html/title-metadata.html
      html-table-processing: none
    pdf:
      documentclass: scrartcl
      toc-depth: 1
      pdffont: Open Sans
      number-sections: true
      number-depth: 4
      classoption:
        - DIV=11
      papersize: a4
      fontsize: 9pt
      extra_dependencies: ["float"]
      fig-dpi: 1200
      fig-width: 5
      fig-format: svg
      logo2: ../ofce/img/sciencespo.png
      template-partials:
        - pdf/title.tex
        - pdf/before-body.tex
