title: Format prévision OFCE (pdf par chapitre)
author: Anissa Saumtally
version: 0.1.0
quarto-required: ">=1.9.38"
contributes:
  formats:
    # Pdf d'un chapitre de la prévision : le gabarit (typst/typst-template.typ)
    # est une copie adaptée de celui du document de travail (../wp), avec en
    # couverture un sommaire commun à tous les chapitres, construit à partir de
    # la barre latérale du site (sommaire.lua).
    #
    # `serie` (« Prévisions d'octobre 2026 ») et `embargo` (« 14/10/2026, 9h00 »)
    # changent à chaque prévision : ils sont renseignés dans _quarto.yml.
    common:
      toc: false
      lang: fr
      french: true
      fig-asp: 0.61
      cap-location: top
      language:
        fr:
          section-title-references: "Bibliographie"
          title-block-author-single: "Par"
          title-block-author-plural: "Par"
          title-block-published: "Publié le"
          title-block-modified: "Màj le"
          callout-tip-title: "Encadré"
          toc-title: "Sur cette page"
          draft: "Version préliminaire"
        en:
          section-title-references: "Bibliography"
          title-block-author-single: "Author"
          title-block-author-plural: "Authors"
          title-block-published: "Published on"
          title-block-modified: "Updated on"
          callout-tip-title: "Box"
          toc-title: "On this page"
          draft: "Preliminary version"
      crossref:
        chapters: false
        title-delim: "**.**"
        fr:
          fig-prefix: graphique
          tbl-prefix: tableau
          eq-prefix: équation
          sec-prefix: section
          tip-prefix: encadré
          fig-title: "**Graphique**"
          tip-title: "**Encadré**"
          title-delim: "**.**"
          tbl-title: "**Tableau**"
          lof-title: Graphiques
          lot-title: Tableaux
        en:
          fig-prefix: figure
          tbl-prefix: table
          eq-prefix: equation
          sec-prefix: section
          tip-prefix: box
          fig-title: "**Figure**"
          tip-title: "**Box**"
          title-delim: "**.**"
          tbl-title: "**Table**"
          lof-title: Figures
          lot-title: Tables
      filters:
        - ../wp/_extensions/quotes/quotes.lua
        - ../wp/_extensions/nbsp/nbsp.lua
        - quarto
        - sommaire.lua
      quot-lang: fr
      csl: ../ofce/csl/revue-francaise-de-gestion.csl
      license: CC BY

    typst:
      mainfont: Arimo
      keep-typ: false
      fig-format: svg
      fig-dpi: 1200
      # Pas de table des matières interne : le sommaire commun en tient lieu.
      toc: false
      toc-depth: 1
      institut: ife-ofce
      callout-icon: false
      section-numbering: 1.1.a
      citeproc: true
      papersize: a4
      logo: false
      thanks-title-fr: "Remerciements"
      thanks-title-en: "Acknowledgements"
      # Sommaire commun : `sommaire: false` dans le yaml d'une page le retire.
      sommaire: true
      sommaire-title: "Dans cette prévision : "
      # Sections de la barre latérale absentes du sommaire des pdf.
      sommaire-exclure:
        - Présentations
      template-partials:
        - typst/typst-template.typ
        - typst/sommaire.typ
        - typst/typst-show.typ
